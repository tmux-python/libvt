[project]
name = "libvt"
version = "0.1.0a0"
description = "Pure-Python, zero-dependency, typed virtual terminal emulator and streaming VT parser."
requires-python = ">=3.12,<4.0"
authors = [
  {name = "Tony Narlock", email = "tony@git-pull.com"}
]
license = { text = "MIT" }
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Operating System :: MacOS :: MacOS X",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Terminals :: Terminal Emulators/X Terminals",
  "Typing :: Typed",
]
keywords = ["vt", "vt100", "vt500", "ansi", "terminal", "emulator", "tmux", "pytest"]
readme = "README.md"
dependencies = []

[project.urls]
"Bug Tracker" = "https://github.com/tmux-python/libvt/issues"
Documentation = "https://libvt.git-pull.com"
Repository = "https://github.com/tmux-python/libvt"
Changes = "https://github.com/tmux-python/libvt/blob/master/CHANGES"

[project.entry-points.pytest11]
libvt = "libvt.pytest_plugin"

[dependency-groups]
dev = [
  # Docs (via gp-sphinx)
  "gp-sphinx==0.1.0a39",
  "sphinx-autodoc-api-style==0.1.0a39",
  "sphinx-autodoc-pytest-fixtures==0.1.0a39",
  "sphinx-autobuild",
  # Testing
  "gp-libs>=0.0.19",
  "pytest",
  "pytest-asyncio",
  "pytest-rerunfailures>=16.2",
  "pytest-watcher",
  "pytest-xdist>=3.8.0",
  # Coverage
  "coverage",
  "pytest-cov",
  # Lint / typecheck
  "ruff>=0.17.3",
  "ty>=0.0.58",
]
docs = [
  "gp-sphinx==0.1.0a39",
  "sphinx-autodoc-api-style==0.1.0a39",
  "sphinx-autodoc-pytest-fixtures==0.1.0a39",
  "sphinx-autobuild",
]
testing = [
  "gp-libs>=0.0.19",
  "pytest",
  "pytest-asyncio",
  "pytest-rerunfailures>=16.2",
  "pytest-watcher",
  "pytest-xdist>=3.8.0",
]
coverage = [
  "coverage",
  "pytest-cov",
]
lint = [
  "ruff>=0.17.3",
  "ty>=0.0.58",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libvt"]
exclude = [
  "src/libvt/**/AGENTS.md",
  "src/libvt/**/CLAUDE.md",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/libvt",
  "tests",
  "docs",
  "CHANGES",
  "MIGRATION",
  "README.md",
  "LICENSE",
  "conftest.py",
]

[tool.uv]
python-preference = "system"

[tool.uv.exclude-newer-package]
gp-furo-theme = false
gp-libs = false
gp-sphinx = false
sphinx-autodoc-api-style = false
sphinx-autodoc-argparse = false
sphinx-autodoc-docutils = false
sphinx-autodoc-fastmcp = false
sphinx-autodoc-pytest-fixtures = false
sphinx-autodoc-sphinx = false
sphinx-autodoc-typehints-gp = false
sphinx-fonts = false
sphinx-gp-highlighting = false
sphinx-gp-mermaid = false
sphinx-gp-opengraph = false
sphinx-gp-llms = false
sphinx-gp-sitemap = false
sphinx-gp-theme = false
sphinx-ux-autodoc-layout = false
sphinx-ux-badges = false

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
blanket-ignore-comment = "error"

[tool.ty.src]
include = [
  "src",
  "tests",
]

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.run]
branch = true
parallel = true
omit = [
  "docs/conf.py",
  "tests/test_*.py",
  "tests/*/test_*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "return NotImplemented",
  "if TYPE_CHECKING:",
  "if t.TYPE_CHECKING:",
  "@overload( |$)",
  "@t\\.overload( |$)",
  'class .*\bProtocol\):',
  "from __future__ import annotations",
  "import typing as t",
  "^\\s*\\.\\.\\.$",
  "^\\s*pass$",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = [
  "E", # pycodestyle
  "F", # pyflakes
  "I", # isort
  "UP", # pyupgrade
  "A", # flake8-builtins
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "COM", # flake8-commas
  "EM", # flake8-errmsg
  "Q", # flake8-quotes
  "PTH", # flake8-use-pathlib
  "SIM", # flake8-simplify
  "TRY", # Trycertatops
  "PERF", # Perflint
  "RUF", # Ruff-specific rules
  "D", # pydocstyle
  "FA100", # future annotations
  "LOG", # flake8-logging
  "G", # flake8-logging-format
  "ANN", # flake8-annotations
  "N", # pep8-naming
  "T20", # flake8-print
  "PT", # flake8-pytest-style
  "RET", # flake8-return
  "FURB", # refurb
]
ignore = [
  "COM812", # missing trailing comma, ruff format conflict
  "ANN401", # dynamically typed boundaries intentionally use Any
  "PT018", # composite assertions kept together intentionally
]
extend-safe-fixes = [
  "UP006",
  "UP007",
]
pyupgrade.keep-runtime-typing = false

[tool.ruff.lint.isort]
known-first-party = [
  "libvt",
]
combine-as-imports = true
required-imports = [
  "from __future__ import annotations",
]

[tool.ruff.lint.flake8-builtins]
builtins-allowed-modules = [
  "dataclasses",
  "random",
  "types",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]
"docs/conf.py" = ["S102"]

[tool.pytest.ini_options]
addopts = [
  "--tb=short",
  "--no-header",
  "--showlocals",
  "--doctest-docutils-modules",
  "-p no:doctest",
  "--strict-markers",
]
doctest_optionflags = [
  "ELLIPSIS",
  "NORMALIZE_WHITESPACE",
]
testpaths = [
  "src/libvt",
  "tests",
  "docs",
  "README.md",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
markers = [
  "integration: integration tests (require optional system utilities)",
]
